<!doctype html>

<head>

  <link rel="apple-touch-icon" href="/assets/logo-image-DSLpRlxU.png" />

  <!-- Viewport & Theme -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <!-- Primary SEO -->
  <title>CodexConquer</title>
  <meta name="description"
    content="CodexConquer is a full-service digital company specializing in Web Development, App Development, Social Media Marketing, UI/UX Design, and Online Courses. Transform your business today." />
  <meta name="keywords"
    content="web development, app development, social media marketing, UI/UX design, digital company, CodexConquer" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="CodexConquer" />
  <link rel="canonical" href="https://codexconquer.com/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://codexconquer.com/" />
  <meta property="og:title" content="CodexConquer" />
  <meta property="og:description"
    content="Full-service digital company: Web Development, App Development, Social Media Marketing, UI/UX Design & Online Courses." />

  <meta property="og:site_name" content="CodexConquer" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@CodexConquer" />
  <meta name="twitter:title" content="CodexConquer" />

    content="Full-service digital company: Web Development, App Development, Social Media Marketing & more." />
  <meta name="twitter:image" content="https://codexconquer.com/experts-team.png" />

  <!-- =============================================
       CDN PERFORMANCE: Preconnect & DNS-Prefetch
       Establishes early connections to all external
       origins before the browser discovers them.
  ============================================== -->
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- React CDN (esm.sh - fastest global ESM CDN) -->
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <!-- Icon CDNs -->
  <link rel="preconnect" href="https://img.icons8.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <!-- Image CDNs -->
  <link rel="dns-prefetch" href="https://images.unsplash.com" />
  <link rel="dns-prefetch" href="https://s3-us-west-2.amazonaws.com" />
  <!-- Lordicon -->
  <link rel="dns-prefetch" href="https://cdn.lordicon.com" />

  <!-- =============================================
       FONTS: Critical font preload + stylesheet
       Using display=swap to avoid render blocking.
  ============================================== -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@400;600;700;800;900&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@400;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Fraunces — display italic serif used for accent headline text
       (e.g. "Visual Impact" in DesignXShowcase) -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
    rel="stylesheet" />

  <!-- =============================================
       CDN: React & ReactDOM (Production)
       Loaded from jsDelivr — one of the world's
       fastest CDNs with 750+ PoPs globally.
       The browser caches these across ALL websites
       using the same CDN URLs, so visitors who
       have used any React site will load these
       instantly from their local browser cache.
       NOTE: These tags are injected at build time
       by the Vite CDN plugin (production only).
  ============================================== -->

  <!-- Lordicon Script -->
  <script src="https://cdn.lordicon.com/lordicon.js" defer></script>
  <script type="module" crossorigin src="/assets/index-BytNgFHL.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DRvG_H3D.css">
</head>

<body>
  <div id="root"></div>
</body>

</html>
